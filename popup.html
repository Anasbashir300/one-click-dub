<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Click Dub</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    .ocd-field { display: grid; gap: 7px; margin-bottom: 12px; }
    .ocd-field span { font-size: 13px; font-weight: 800; color: #ddd8e8; }
    .ocd-native-select {
      width: 100%; min-height: 44px; border-radius: 10px; padding: 0 12px;
      color: #f6f3fb; background: rgba(11, 13, 20, .78);
      border: 1px solid rgba(255,255,255,.16); outline: none; font-weight: 750;
    }
    .ocd-native-select option { color: #111827; background: #fff; }
    .ocd-voice-actions { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: -2px; }
    .ocd-preview-btn {
      width: 100%; border: 0; border-radius: 10px; padding: 10px 12px;
      cursor: pointer; font-weight: 850; color: #fff;
      background: linear-gradient(90deg, #343a54, #6029a8);
    }
    .ocd-help { margin: 6px 0 0; font-size: 12px; color: #aaa2b8; line-height: 1.55; }
  </style>
</head>
<body>
  <section class="extension-panel" aria-label="لوحة إضافة One Click Dub">
    <button class="panel-close" aria-label="إغلاق">×</button>
    <div class="brand-row" dir="ltr">
      <span class="big-logo"></span>
      <h1>ONE CLICK <span>DUB</span></h1>
    </div>

    <form class="settings">
      <label class="ocd-field">
        <span>لغة المصدر</span>
        <select id="sourceLanguage" class="ocd-native-select" name="sourceLanguage">
          <option value="auto">اكتشاف تلقائي</option>
          <option value="en">English</option>
          <option value="ar">العربية</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
          <option value="tr">Türkçe</option>
          <option value="hi">हिन्दी</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="zh">中文</option>
        </select>
      </label>

      <label class="ocd-field">
        <span>لغة الدبلجة</span>
        <select id="targetLanguage" class="ocd-native-select" name="targetLanguage">
          <option value="ar">العربية</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
          <option value="tr">Türkçe</option>
          <option value="hi">हिन्दी</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="zh">中文</option>
        </select>
      </label>

      <label class="ocd-field">
        <span>النموذج</span>
        <select id="modelName" class="ocd-native-select" name="modelName" dir="ltr">
          <option value="fast">Fast — Edge TTS</option>
          <option value="quality">Quality — OmniVoice</option>
          <option value="pro">Pro — Fish Speech</option>
        </select>
      </label>

      <label class="ocd-field">
        <span>الصوت</span>
        <select id="voiceName" class="ocd-native-select" name="voiceName"></select>
      </label>

      <div class="ocd-voice-actions">
        <button type="button" id="ocdVoicePreviewButton" class="ocd-preview-btn">▶ عينة الصوت</button>
        <p id="ocdVoiceHelp" class="ocd-help">Fast يعرض صوت ذكر وصوت أنثى لكل لغة. Quality وPro: استنساخ صوت الفيديو أو 4 أصوات جاهزة.</p>
      </div>

      <div class="volume-row">
        <span>رفع الصوت</span>
        <div class="slider-line" dir="ltr"><i>☊</i><b></b></div>
        <output>80%</output>
      </div>

      <div class="toggle-row">
        <span>عرض الكابشن</span>
        <button type="button" class="toggle on" aria-label="عرض الكابشن"><span></span></button>
      </div>

      <button type="button" class="primary-cta">حفظ الإعدادات <i>›</i></button>
      <button type="button" class="ai-cta"><span>[Ai]</span> تلخيص الفيديو بالذكاء الاصطناعي <i>›</i></button>
    </form>

    <p class="trust-line">آمن • خاص • يعمل بالكامل في متصفحك <span>♢</span></p>
  </section>
  <script src="popup.js"></script>
</body>
</html>
